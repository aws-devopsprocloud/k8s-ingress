apiVersion: v1 
kind: Pod 
metadata: 
  name: app2 
  namespace: roboshop 
  labels:
    component: app2
spec:
  containers: 
  - name: app2  
    image: devopsprocloudaws/app2:v1
    ports:
    - containerPort: 80 

--- 
apiVersion: v1 
kind: Service 
metadata:
  name: app2
spec: 
  selector: 
    component: app2
  ports: 
  - protocol: TCP
    port: 80 # service port 
    targetPort: 80 # container port 

--- 
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app2
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/tags: Environment=dev,Project=roboshop
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: roboshop
spec:
  ingressClassName: alb
  rules:
  - host: "app2.devopsprocloud.in"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: app2
            port:
              number: 80
 